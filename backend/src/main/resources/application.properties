# Scoops of Brainfreeze - Intentionally Vulnerable Configuration
# DO NOT USE IN PRODUCTION

spring.application.name=scoops-of-brainfreeze

# H2 Database (in-memory for easy demos)
spring.datasource.url=jdbc:h2:mem:scoopsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Show SQL (helpful for demos, bad for production)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Intentionally weak / verbose error handling for A02 & A10 demos
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true

# CORS wide open for demo convenience (A02)
# In real apps this should be restricted
